[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fips"
dynamic = ["version"]  # from git tags, via setuptools-scm
description = "Flexible Inverse Problem Solver (FIPS)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "James Mineau", email = "jameskmineau@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "joblib>=1.4.0",
    "numpy>=1.22.0",
    "pandas>=2.0.0",  # need pandas 2.0 for upgraded Index object
    "scipy>=1.8.0",
    "xarray>=2022.3.0",
]

[project.optional-dependencies]
flux = [
    "cartopy>=0.24.0",  # numpy 2.0 support
    "h5py>=3.11.0",  # numpy 2.0 support
    "matplotlib>=3.6.0",
    "pystilt>=0.1.0a21",  # variants: model.simulations.sel(variant=...)
]

[dependency-groups]
dev = [
    "fips[flux]",
    "docstr-coverage>=2.0.0",
    "ipykernel>=7.2.0",
    "myst-parser>=2.0.0",
    "nbsphinx>=0.9.0",
    "pre-commit>=3.0.0",
    "pydata-sphinx-theme>=0.14.0",
    "pyrefly>=1.3",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "setuptools-scm>=8",
    "ruff>=0.1.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/jmineau/fips"
Documentation = "https://jmineau.github.io/fips/"
Repository = "https://github.com/jmineau/fips"
Issues = "https://github.com/jmineau/fips/issues"

[tool.coverage.run]
source = ["src/fips"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

[tool.pyrefly]
project-includes = ["src"]
# The errors that existed when fips moved from pyright to pyrefly (2026-10). New
# errors fail the check; fix the listed ones over time, then run
# `uv run pyrefly check --update-baseline` (or `--prune-baseline`) to shrink it.
baseline = "pyrefly-baseline.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:numpy.core.multiarray is deprecated:DeprecationWarning",
]

[tool.ruff]
# target-version comes from project.requires-python

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "D",  # pydocstyle
]
ignore = [
    "E501",  # line too long, handled by formatter
    "D200",  # One-line docstring should fit on one line with quotes
    "D212",  # Multi-line docstring summary should start at the first line
    "D400", # First line should end with a period, question mark, or exclamation point
]

[tool.ruff.lint.isort]
known-first-party = ["fips"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fips" = ["py.typed"]

[tool.setuptools_scm]
# Releases are git tags vX.Y.Z (see CONTRIBUTING.md). Between releases the
# version is the next one as a dev version, e.g. 0.1.0b9.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)

[tool.uv]
required-version = ">=0.12"
# Rebuild the editable install when pyproject.toml or the git state changes, so
# `__version__` follows new commits and tags.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
