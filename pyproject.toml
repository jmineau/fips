[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fips"
dynamic = ["version"]  # from git tags, via setuptools-scm
description = "Flexible Inverse Problem Solver (FIPS)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "James Mineau", email = "jameskmineau@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "joblib>=1.4.0",
    "numpy>=1.22.0",
    "pandas>=2.0.0",  # need pandas 2.0 for upgraded Index object
    "scipy>=1.8.0",
    "xarray>=2022.3.0",
]

[project.optional-dependencies]
flux = [
    "cartopy>=0.24.0",  # numpy 2.0 support
    "h5py>=3.11.0",  # numpy 2.0 support
    "matplotlib>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/jmineau/fips"
Documentation = "https://jmineau.github.io/fips/"
Repository = "https://github.com/jmineau/fips"
Issues = "https://github.com/jmineau/fips/issues"
Changelog = "https://github.com/jmineau/fips/blob/main/CHANGELOG.md"

[dependency-groups]
# Dev tooling and docs together; `uv sync` installs it by default.
dev = [
    "fips[flux]",
    "docstr-coverage>=2.3",
    "git-cliff>=2.10",  # `just changelog`
    "ipython>=9.0",  # `.. ipython::` in the docs
    "matplotlib>=3.8",  # `.. plot::` in the docs
    "myst-nb>=1.2",  # notebooks and Markdown code cells in the docs
    "pre-commit>=4.0",
    "pydata-sphinx-theme>=0.16",
    "pyrefly>=1.3",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16",
    "rust-just>=1.40",
    "setuptools-scm>=8",  # `just version`
    "sphinx>=8.1",
    "sphinx-autobuild>=2024.10",  # `just docs-serve`
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5",
    "twine>=6.0",  # `just dist`
]

[tool.coverage.run]
source = ["fips"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.11"  # as CI checks, against the oldest supported Python
# The errors that existed when fips moved from pyright to pyrefly (2026-10). New
# errors fail the check; fix the listed ones over time, then run
# `uv run pyrefly check --update-baseline` (or `--prune-baseline`) to shrink it.
baseline = "pyrefly-baseline.json"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true  # strict markers, config, xfail and parametrize ids
addopts = ["-ra"]
log_level = "INFO"  # show captured logs for failing tests
# Warnings are errors, so deprecations surface early. Ignore a specific
# third-party warning with e.g. "ignore:some message:DeprecationWarning:pkg".
filterwarnings = [
    "error",
    # numpy ignores this one itself (compiled packages such as netCDF4 raise it on
    # import); pytest's "error" filter would bring it back.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
markers = [
    "network: needs live network access; excluded from default runs",
    "slow: expensive in time, bandwidth or disk; excluded from default runs",
]

[tool.repo-review]
# Scientific Python repo-review (`uvx --from "sp-repo-review[cli]" sp-repo-review .`)
# checks that this template skips on purpose:
ignore = [
    "PY007",  # task runner: just, not nox/tox
    "MY101",  # pyrefly's default preset; tighten per project
    "PC110", "PC190",  # ruff runs as a local `uv run` hook, so uv.lock pins its version
    "PC140",  # pyrefly runs as a local `uv run` hook, so it sees the project's dependencies
    "PC160",  # no spell checker
    "PC180",  # no markdown formatter
    "PC901", "PC902", "PC903",  # pre-commit.ci is not used
]

[tool.ruff]
# target-version comes from project.requires-python

[tool.ruff.format]
docstring-code-format = true
# ruff also formats code blocks in Markdown; these keep their examples as written
# (e.g. hand-aligned comments).
exclude = ["README.md", "AGENTS.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "D",  # pydocstyle, NumPy convention (below)
    "D213",  # docstring summary on the second line
    "NPY",  # NumPy-specific, incl. NumPy 2 deprecations
    "RUF100",  # unused noqa
]
ignore = [
    "E501",  # line too long, handled by formatter
    "D105",  # magic methods need no docstring (docstr-coverage skips them too)
    "D200",  # One-line docstring should fit on one line with quotes
    "D212",  # Multi-line docstring summary should start at the first line
    "D400",  # First line should end with a period, question mark, or exclamation point
]

[tool.ruff.lint.per-file-ignores]
# Tests and the pre-run example notebooks seed numpy's legacy global RNG on
# purpose; switching them to np.random.default_rng would change their numbers.
# Tests also need no docstrings, and a fixture's names what it provides ("A small
# grid."); the other docstring rules still apply to them.
"tests/**" = ["NPY002", "D100", "D101", "D102", "D103", "D104", "D106", "D107", "D401"]
"docs/**/*.ipynb" = ["NPY002"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["fips"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fips" = ["py.typed"]

[tool.setuptools_scm]
# Releases are git tags vX.Y.Z (see CONTRIBUTING.md). Between releases the
# version is the next one as a dev version, e.g. 0.1.0b9.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)

[tool.uv]
required-version = ">=0.12"
# Rebuild the editable install when pyproject.toml or the git state changes, so
# `__version__` follows new commits and tags. This replaces uv's default keys, so
# add { file = "setup.py" } (and any C sources) if the project has them.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
