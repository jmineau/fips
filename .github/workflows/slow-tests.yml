name: Slow tests

# The tests marked `slow` (long statistical checks of the sampled methods), which
# the Tests workflow skips. They run when something they check changes: a pull
# request that touches the methods, the samplers' inputs, uv.lock or the slow
# tests; the monthly lock upgrade (which starts this workflow by hand); and by
# hand. Not on a schedule: dependencies are locked and the tests are seeded, so
# a run on an unchanged main repeats the last one.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/fips/methods/**
      - src/fips/hyperparameters.py
      - src/fips/transforms.py
      - src/fips/forward.py
      - src/fips/posterior.py
      - src/fips/distributions.py
      - tests/test_bounded.py
      - tests/test_evidence.py
      - tests/test_gauss_newton.py
      - tests/test_hierarchical.py
      - tests/test_outside_sampler.py
      - tests/test_variational.py
      - uv.lock
      - .github/workflows/slow-tests.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow:
    name: ubuntu-latest / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UV_NO_SYNC: "1"  # `just` recipes run in the environment synced below

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.13"

      - name: Install
        run: uv sync --locked

      - name: Slow tests
        run: uv run just test-slow --durations=0
